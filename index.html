<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f7f6;
        margin: 40px;
      }
      .dashboard-container {
        display: flex;
        gap: 40px;
        max-width: 900px;
        margin: 0 auto;
      }
      .form-panel {
        flex: 1;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .table-panel {
        flex: 2;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button[type="submit"] {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 10px 15px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #f8f9fa;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(15, 23, 42, 0.4);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.2s ease,
          visibility 0.2s ease;
      }

      .modal-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      .modal-card {
        background: #ffffff;
        padding: 24px;
        border-radius: 12px;
        width: 320px;
        max-width: 90vw;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
        text-align: center;
        transform: scale(0.92);
        transition: transform 0.2s ease;
        box-sizing: border-box;
      }

      .modal-overlay.active .modal-card {
        transform: scale(1);
      }

      .modal-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px auto;
        font-size: 1.25rem;
        font-weight: bold;
      }

      .modal-icon.error {
        background-color: #fef2f2;
        color: #dc2626;
      }

      .modal-icon.success {
        background-color: #f0fdf4;
        color: #16a34a;
      }

      .modal-title {
        margin: 0 0 8px 0;
        font-size: 1.1rem;
        font-weight: 700;
        color: #0f172a;
      }

      .modal-message {
        margin: 0 0 20px 0;
        color: #64748b;
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .modal-btn {
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.875rem;
        width: 100%;
        transition: opacity 0.2s;
      }

      .modal-btn:hover {
        opacity: 0.9;
      }

      .modal-btn.error {
        background-color: #dc2626;
      }

      .modal-btn.success {
        background-color: #16a34a;
      }
    </style>
  </head>
  <body>
    <h2 style="text-align: center; margin-bottom: 30px">
      Student Management Dashboard
    </h2>

    <div class="dashboard-container">
      <div class="form-panel">
        <h3>Add New Student</h3>
        <form id="studentForm">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="e.g. Viktor" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="e.g. Magtatanggol" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              id="email"
              placeholder="viktor.magtatanggol@example.com"
            />
          </div>
          <button type="submit">Submit Record</button>
        </form>
      </div>

      <div class="table-panel">
        <h3>Registered Students</h3>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="customModal" class="modal-overlay">
      <div class="modal-card">
        <div id="modalIcon" class="modal-icon"></div>
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalMessage" class="modal-message"></p>
        <button id="modalOkBtn" class="modal-btn">OK</button>
      </div>
    </div>

    <script>
      const customModal = document.getElementById("customModal");
      const modalIcon = document.getElementById("modalIcon");
      const modalTitle = document.getElementById("modalTitle");
      const modalMessage = document.getElementById("modalMessage");
      const modalOkBtn = document.getElementById("modalOkBtn");

      window.showCustomModal = function (title, message, isSuccess = false) {
        modalTitle.textContent = title;
        modalMessage.textContent = message;

        if (isSuccess) {
          modalIcon.className = "modal-icon success";
          modalIcon.textContent = "✓";
          modalOkBtn.className = "modal-btn success";
        } else {
          modalIcon.className = "modal-icon error";
          modalIcon.textContent = "!";
          modalOkBtn.className = "modal-btn error";
        }

        customModal.classList.add("active");
      };

      modalOkBtn.addEventListener("click", () => {
        customModal.classList.remove("active");
      });

      window.alert = function (msg) {
        window.showCustomModal("Validation Error", msg, false);
      };

      document.addEventListener("DOMContentLoaded", () => {
        const studentForm = document.getElementById("studentForm");
        if (studentForm) {
          studentForm.addEventListener(
            "submit",
            (event) => {
              const firstName = document
                .getElementById("firstName")
                .value.trim();
              const lastName = document.getElementById("lastName").value.trim();
              const email = document.getElementById("email").value.trim();

              if (firstName && lastName && email) {
                window.showCustomModal(
                  "Success",
                  "Student record submitted successfully!",
                  true,
                );
              }
            },
            true,
          );
        }
      });
    </script>

    <script src="app.js" type="module"></script>
  </body>
</html>
